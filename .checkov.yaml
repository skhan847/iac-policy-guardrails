# Checkov: broad, off-the-shelf misconfiguration scanning (hundreds of rules).
# The custom Rego policies in policies/ cover organisation-specific rules that
# Checkov does not know about. Every skip below needs a written justification;
# reviewers should challenge new entries the same way they challenge exceptions.

directory:
  - .
framework:
  - terraform
  - github_actions
compact: true
quiet: true
download-external-modules: false
skip-path:
  - policies/fixtures

skip-check:
  # Cross-region replication doubles storage cost; not required for a dev environment.
  - CKV_AWS_144
  # Customer-managed KMS keys cost $1/month each. AWS managed keys are used for
  # assets and state; the logs bucket must use SSE-S3 for access-log delivery.
  - CKV_AWS_145
  - CKV_AWS_158
  # S3 event notifications have no consumer in this project.
  - CKV2_AWS_62
  # The logs bucket and the state bucket are not themselves access-logged
  # (logging the log bucket creates a loop). The assets bucket is logged.
  - CKV_AWS_18
  # Multi-AZ, Enhanced Monitoring and Performance Insights are production
  # features with ongoing cost; out of scope for the free-tier dev environment.
  - CKV_AWS_157
  - CKV_AWS_118
  - CKV_AWS_353
  - CKV2_AWS_30
  # Deletion protection is off only in dev, under approved policy exception
  # DB-004 (policies/data/exceptions.json). The module default is true.
  - CKV_AWS_293
